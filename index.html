<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Mulți Ani Dorin!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Font Awesome 6 for proper icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Canvas: stars + glow orbs -->
    <canvas id="bgCanvas"></canvas>

    <!-- Floating SVG icons (injected by script.js) -->
    <div id="heartsWrap" aria-hidden="true"></div>

    <!-- Main card -->
    <main class="page">
        <div class="card">

            <!-- Candle light flash overlay -->
            <div class="candle-flash" id="candleFlash"></div>

            <!-- ============ CAKE STAGE ============ -->
            <div class="stage" id="stage">

                <!-- 5 candles -->
                <div class="candle-row">
                    <div class="candle" id="c1">
                        <div class="flame-box" id="f1"><div class="flame"><div class="flame-in"></div></div></div>
                        <div class="wick"></div>
                        <div class="wax wax-pink"></div>
                    </div>
                    <div class="candle" id="c2">
                        <div class="flame-box" id="f2"><div class="flame"><div class="flame-in"></div></div></div>
                        <div class="wick"></div>
                        <div class="wax wax-white"></div>
                    </div>
                    <div class="candle" id="c3">
                        <div class="flame-box" id="f3"><div class="flame"><div class="flame-in"></div></div></div>
                        <div class="wick"></div>
                        <div class="wax wax-pink"></div>
                    </div>
                    <div class="candle" id="c4">
                        <div class="flame-box" id="f4"><div class="flame"><div class="flame-in"></div></div></div>
                        <div class="wick"></div>
                        <div class="wax wax-white"></div>
                    </div>
                    <div class="candle" id="c5">
                        <div class="flame-box" id="f5"><div class="flame"><div class="flame-in"></div></div></div>
                        <div class="wick"></div>
                        <div class="wax wax-pink"></div>
                    </div>
                </div>

                <div class="cream cream-top" id="creamTop"></div>

                <!-- Berries on top cream -->
                <div class="berry-group" id="berryGroup">
                    <div class="berry"></div>
                    <div class="berry"></div>
                    <div class="berry"></div>
                </div>

                <div class="tier tier-top" id="tierTop">
                    <div class="tier-dots"></div>
                    <div class="tier-flowers">
                        <i class="fa fa-star"></i>
                        <i class="fa fa-star"></i>
                        <i class="fa fa-star"></i>
                    </div>
                </div>

                <div class="cream cream-mid" id="creamMid"></div>

                <div class="tier tier-bot" id="tierBot">
                    <div class="tier-dots"></div>
                    <div class="tier-hearts">
                        <i class="fa fa-star"></i>
                        <i class="fa fa-gem"></i>
                        <i class="fa fa-star"></i>
                        <i class="fa fa-gem"></i>
                        <i class="fa fa-star"></i>
                    </div>
                </div>

                <div class="plate" id="plate"></div>

            </div><!-- /.stage -->

            <!-- ============ BIRTHDAY MESSAGE ============ -->
            <div class="bday" id="bday">
                <p class="sparkles" aria-hidden="true">
                    <i class="fas fa-star"></i>
                    <i class="fas fa-gem"></i>
                    <i class="fas fa-star"></i>
                </p>
                <h1 class="bday-title" id="bdayTitle">La Mulți Ani,<br><em>Dorin!</em></h1>
                <p class="bday-sub" id="bdaySub"></p>
                <p class="sparkles" aria-hidden="true">
                    <i class="fas fa-gem"></i>
                    <i class="fas fa-star"></i>
                    <i class="fas fa-gem"></i>
                </p>
            </div>

        </div><!-- /.card -->
    </main>

    <!-- Controls -->
    <div class="controls">
        <button class="btn" onclick="replayAnim()">
            <i class="fas fa-rotate-right"></i> Repetă
        </button>
        <button class="btn" id="musicBtn" onclick="toggleMusic()">
            <i class="fas fa-music"></i> Muzică
        </button>
    </div>

    <script src="script.js"></script>
</body>
</html>
